[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiohttp>=3.14.5",
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "boto3>=1.40.61",
    "cryptography>=50.0.2",
    "dbos[otel]>=3.5.0",
    "fastapi[standard]>=0.162.4",
    "google>=3.0.0",
    "httpx>=0.28.1",
    "livekit-api>=1.2.2",
    "logfire[fastapi,httpx,sqlalchemy]>=5.5.0",
    "loguru>=0.7.3",
    "mcp>=2.3.0",
    "openai>=3.49.0",
    "orjson>=3.13.0",
    "phonenumbers>=9.0.43",
    "pipecat-ai[anthropic,azure,elevenlabs,google,livekit,silero,tracing]>=1.15.0",
    "pydantic-ai-slim[google,groq,logfire,openai]>=2.67.0",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.16.2",
    "pydantic[email]>=2.14.3",
    "python-dotenv>=1.2.4",
    "sqlalchemy[asyncio]>=2.1.8",
    "starlette>=1.10.0",
    "tenacity>=9.1.4",
    "uvicorn[standard]>=0.54.0",
    "wireup>=2.13.1",
]

[dependency-groups]
dev = [
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
    "taskipy>=1.14.1",
]

[tool.taskipy.tasks]
lint = { cmd = "ruff format . && ruff check --fix .", help = "format and lint, fixing what can be fixed" }
lint_check = { cmd = "ruff format --check . && ruff check .", help = "check formatting and lint (no changes)" }
lint_types = { cmd = "pyrefly check --summarize-errors", help = "type check" }

[tool.pyrefly]
project-includes = ["src"]
search-path = ["."]
python-version = "3.14"
# Only "." is a root, so `import logfire` / `import fastapi` find the packages,
# not our own src/logfire.py and src/fastapi.py.
disable-search-path-heuristics = true
