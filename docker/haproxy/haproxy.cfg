# Voice service entrypoint (:4001) -> 3 isolated voice workers.
#
# Each worker must handle ONE request or WebSocket at a time (the voice code
# is not concurrency-safe). `maxconn 1` on every server enforces that: extra
# requests wait in HAProxy's queue until a worker frees up, or get a 503
# after `timeout queue`.

global
    maxconn 1000
    log stdout format raw local0

# Docker's embedded DNS, so worker names resolve (and re-resolve after restarts).
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client  60s
    timeout server  60s
    # How long a request may wait for a free worker before getting a 503.
    timeout queue   30s
    # How long an idle WebSocket may stay open.
    timeout tunnel  1h

frontend voice_in
    bind :4001
    default_backend voice_workers

backend voice_workers
    # Send each request to the worker with the fewest active connections.
    balance leastconn

    option httpchk GET /health
    http-check expect status 200

    # One fresh server connection per request, closed afterwards, so an idle
    # keep-alive connection can never carry a second request into a busy worker.
    default-server maxconn 1 check inter 5s resolvers docker init-addr last,libc,none
    
    server voice-1 voice-1:4101
    server voice-2 voice-2:4102
    server voice-3 voice-3:4103
